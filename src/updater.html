<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeachAxo - Проверка обновлений</title>
    <link rel="stylesheet" href="../node_modules/semantic-ui-css/semantic.min.css" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --surface: #ffffff;
        --surface-2: #f2f4f7;
        --line: #e4e7ec;
        --text: #101828;
        --muted: #667085;
        --ink: #344054;
        --primary: #2563eb;
        --danger: #ef4444;
        --progress-track: #e5e7eb;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0b0d12;
        --surface: #12151c;
        --surface-2: #1a1f2a;
        --line: #2a3140;
        --text: #e8eaed;
        --muted: #9aa0ae;
        --ink: #dde1e8;
        --primary: #6eb6ff;
        --danger: #f85149;
        --progress-track: #2a3140;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-app-region: drag;
      }

      .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
      }

      .titlebar-label {
        padding: 0 10px;
        font-size: 12px;
        color: var(--ink);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .titlebar-controls {
        display: flex;
        align-items: stretch;
      }

      .titlebar-btn {
        width: 42px;
        border: 0;
        border-left: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font-size: 16px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .titlebar-btn:hover {
        background: var(--surface-2);
      }

      .titlebar-btn.close:hover {
        background: var(--danger);
        color: #fff;
      }

      .wrap {
        min-height: calc(100vh - 34px);
        display: grid;
        place-items: center;
        padding: 16px;
      }

      html[data-theme="dark"] .wrap {
        background: radial-gradient(1200px 600px at 20% 0%, rgba(110, 182, 255, 0.06), transparent 55%);
      }

      .update-card {
        width: min(500px, 100%);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        padding: 16px;
        box-shadow: none;
      }

      .update-hero {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }

      .update-hero .title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
      }

      .update-hero .sub {
        font-size: 12px;
        color: var(--muted);
      }

      .status {
        margin: 0 0 10px;
        font-size: 14px;
        color: var(--text);
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }

      .ui.progress {
        margin: 0 !important;
        border-radius: 999px !important;
        background: var(--progress-track) !important;
        height: 8px !important;
      }

      .ui.progress .bar {
        background: var(--primary) !important;
      }

      html[data-theme="dark"] .ui.progress {
        border: 1px solid var(--line) !important;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar-label">TeachAxo Updater</div>
      <div class="titlebar-controls">
        <button id="updater-close-btn" class="titlebar-btn close" type="button" title="Закрыть">×</button>
      </div>
    </div>
    <div class="wrap">
      <div class="update-card">
        <div class="update-hero">
          <div class="title">TeachAxo</div>
          <div class="sub">Обновление</div>
        </div>
        <p id="status-message" class="status">Инициализация...</p>
        <div class="ui tiny indicating progress" id="progress-wrap">
          <div class="bar" id="progress-bar"></div>
        </div>
        <div class="meta">Окно закроется автоматически после завершения операции.</div>
      </div>
    </div>

    <script>
      const statusElement = document.getElementById("status-message");
      const progressWrap = document.getElementById("progress-wrap");
      const progressBar = document.getElementById("progress-bar");
      const closeBtn = document.getElementById("updater-close-btn");

      function applyUpdaterTheme(display) {
        if (display === "light" || display === "dark") {
          document.documentElement.setAttribute("data-theme", display);
        }
      }

      async function initUpdaterTheme() {
        try {
          const appearance = await window.teachAxoUpdater.getAppearance?.();
          if (appearance?.display) applyUpdaterTheme(appearance.display);
        } catch (_err) {
          /* keep default (light) */
        }
      }

      initUpdaterTheme();
      window.teachAxoUpdater.onAppearance?.((payload) => {
        if (payload?.display) applyUpdaterTheme(payload.display);
      });

      closeBtn?.addEventListener("click", () => {
        window.teachAxoUpdater.closeWindow?.().catch(() => {});
      });

      function setProgress(percent) {
        const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
        progressBar.style.width = `${safePercent}%`;
      }

      window.teachAxoUpdater.onStatus((payload) => {
        statusElement.textContent = payload.message;

        if (payload.type === "downloading") {
          progressWrap.classList.remove("hidden");
          setProgress(payload.progress || 0);
          return;
        }

        if (payload.type === "up-to-date" || payload.type === "error" || payload.type === "installing") {
          setProgress(100);
          return;
        }

        setProgress(15);
      });
    </script>
  </body>
</html>
