<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeachAxo - Проверка обновлений</title>
    <link rel="stylesheet" href="../node_modules/semantic-ui-css/semantic.min.css" />
    <style>
      :root {
        --bg: #f2f5fb;
        --surface: #ffffff;
        --text: #1c2434;
        --muted: #687387;
        --primary: #4157ff;
        --primary-2: #6d3ef3;
        --border: #e6eaf3;
        --shadow-lg: 0 14px 30px rgba(27, 39, 71, 0.08);
        --radius-lg: 14px;
      }

      body {
        margin: 0;
        background: radial-gradient(1200px 500px at 20% -10%, #e8edff 0%, #f2f5fb 50%, #edf1f8 100%);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
        -webkit-app-region: drag;
      }

      .titlebar {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.82);
        -webkit-app-region: drag;
      }

      .titlebar-label {
        padding-left: 12px;
        font-size: 12px;
        color: #576380;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .titlebar-controls {
        display: flex;
        align-items: stretch;
      }

      .titlebar-btn {
        width: 42px;
        border: 0;
        border-left: 1px solid #e9edf6;
        background: transparent;
        color: #3f4e69;
        font-size: 16px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }

      .titlebar-btn:hover {
        background: #eef2ff;
      }

      .titlebar-btn.close:hover {
        background: #ff4d4f;
        color: #fff;
      }

      .wrap {
        min-height: calc(100vh - 34px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .update-card {
        width: min(540px, 100%);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow-lg);
        padding: 20px;
      }

      .update-hero {
        background: linear-gradient(120deg, #2f4dff 0%, #7344f8 100%);
        border-radius: 10px;
        color: #fff;
        padding: 14px 16px;
        margin-bottom: 14px;
      }

      .update-hero .title {
        font-size: 18px;
        font-weight: 700;
      }

      .update-hero .sub {
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.95;
      }

      .status {
        font-size: 15px;
        margin-bottom: 10px;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }

      .ui.progress {
        margin-top: 8px !important;
      }

      .ui.progress .bar {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%) !important;
      }
    </style>
  </head>
  <body>
    <div class="titlebar">
      <div class="titlebar-label">TeachAxo Updater</div>
      <div class="titlebar-controls">
        <button id="updater-close-btn" class="titlebar-btn close" type="button" title="Закрыть">×</button>
      </div>
    </div>
    <div class="wrap">
      <div class="update-card">
        <div class="update-hero">
          <div class="title">TeachAxo</div>
          <div class="sub">Проверка и установка обновлений</div>
        </div>
        <p id="status-message" class="status">Инициализация...</p>
        <div class="ui tiny indicating progress" id="progress-wrap">
          <div class="bar" id="progress-bar"></div>
        </div>
        <div class="meta">Окно закроется автоматически после завершения операции.</div>
      </div>
    </div>

    <script>
      const statusElement = document.getElementById("status-message");
      const progressWrap = document.getElementById("progress-wrap");
      const progressBar = document.getElementById("progress-bar");
      const closeBtn = document.getElementById("updater-close-btn");

      closeBtn?.addEventListener("click", () => {
        window.teachAxoUpdater.closeWindow?.().catch(() => {});
      });

      function setProgress(percent) {
        const safePercent = Math.max(0, Math.min(100, Math.round(percent)));
        progressBar.style.width = `${safePercent}%`;
      }

      window.teachAxoUpdater.onStatus((payload) => {
        statusElement.textContent = payload.message;

        if (payload.type === "downloading") {
          progressWrap.classList.remove("hidden");
          setProgress(payload.progress || 0);
          return;
        }

        if (payload.type === "up-to-date" || payload.type === "error" || payload.type === "installing") {
          setProgress(100);
          return;
        }

        setProgress(15);
      });
    </script>
  </body>
</html>
